name: Release

# Publishes com.whop.api:whop-java to Maven and GitHub whenever main carries a version not yet published
# there. Only whop-monorepo's SDK pipeline pushes main, and it renders this workflow
# (sdks/release/publish-main.yml.liquid there): plan asks each module whether it has the version
# (.github/release/cli.ts), build checks and packages it (scripts/package.sh), and one job per
# module publishes it, in order. Re-running a run, or dispatching one on main, publishes nothing a
# module already has. A dispatch with rehearse builds and checks main's version as a release would
# (plan and build alone) and publishes, tags and releases nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearse:
        description: Build and check main's version as a release would, publishing, tagging and releasing nothing
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, in push order: every run waits its turn, so no version a delivery raised
# is skipped.
concurrency:
  group: publish-whopsdk-java
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      page: ${{ steps.plan.outputs.page }}
      rehearse: ${{ steps.plan.outputs.rehearse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - id: plan
        run: node .github/release/cli.ts plan --module maven --module github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REHEARSE: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse }}

  # The release, built and checked from this commit: scripts/package.sh leaves what each module's
  # job publishes where the build uploads it from.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Package the release
        id: package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven
          path: build/bundle/
          if-no-files-found: error
          retention-days: 7

  # The SDK repo's public Maven repository is GitHub Pages, served from the immutable maven branch,
  # which keeps every released version's bytes: the job pushes that branch with the workflow token
  # and deploys Pages. Only main's runs reach the github-pages environment, so no other ref's run can
  # push that branch or deploy. Maven has no trusted publishing; no long-lived credential is involved.
  maven:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write # Preserve every immutable release on the maven branch.
      pages: write # Deploy the public Maven repository.
      id-token: write # Prove the main-only Pages deployment's identity.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven
          path: bundle/

      - name: Preserve the verified release and older versions
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init site
          git -C site remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if git -C site ls-remote --exit-code origin refs/heads/maven; then
            git -C site fetch --no-tags --depth=1 origin refs/heads/maven
            git -C site checkout -B maven FETCH_HEAD
          else
            git -C site checkout --orphan maven
          fi
          python3 source/.github/public-maven.py bundle site "$VERSION" "$GITHUB_SHA"
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add .
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Release com.whop.api:whop-java:${VERSION} from ${GITHUB_SHA}"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            export GIT_CONFIG_VALUE_0
            git -C site push origin HEAD:refs/heads/maven
          fi
          rm -rf site/.git

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy the public Maven repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Wait until the Maven repository has the version
        run: node source/.github/release/cli.ts confirm --module maven

  # Runs even when nothing was published: a version tagged before it had a GitHub release gets one,
  # and a repo shipped dark writes nothing. A new tag goes only on the commit of the run that planned
  # to publish (PUBLISHED): re-run that run's failed jobs. A rehearsal never runs it.
  github:
    needs: [plan, build, maven, verify]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.rehearse != 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # cli.ts release creates the version's tag and GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: node .github/release/cli.ts release --module maven --module github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.plan.outputs.publish == 'true' }}
          REHEARSE: ${{ needs.plan.outputs.rehearse }}

  # The release as a consumer gets it from where the modules published it: scripts/verify.sh.
  # The github job tags the version only once this passes.
  verify:
    needs: [plan, maven]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Verify the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/verify.sh
